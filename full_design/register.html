<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar Akun · Shema</title>
<link rel="icon" type="image/png" href="assets/logo-shema.png" />
<link rel="stylesheet" href="assets/styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card" data-reveal>
    <div class="auth-logo">
      <img src="assets/logo-shema.png" alt="Shema" style="width:84px;height:84px;" />
      <h1 style="font-size:22px;margin-top:6px;">Daftar Akun Baru</h1>
      <p class="text-sm muted">Isi data singkat ini untuk mulai bergabung di GKI Gejayan.</p>
    </div>
    <div class="auth-panel">
      <form class="flex-col gap-3">
        <div class="field"><label>Nama Lengkap</label><input class="input" placeholder="Nama sesuai KTP" /></div>
        <div class="field"><label>Nomor WA</label><input class="input" placeholder="0812-3456-7890" /><p class="hint">Admin akan menghubungi nomor ini untuk mengaktifkan akunmu.</p></div>
        <button class="btn btn-primary btn-block" style="margin-top:6px;" type="button">Daftar</button>
      </form>
      <p class="text-sm muted" style="text-align:center;margin-top:16px;">Sudah punya akun? <a href="login.html" class="link-accent">Masuk</a></p>
    </div>
  </div>
</div>
</body>
</html>
